<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Support Ticket</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .chat-container { max-width: 800px; margin: 40px auto; padding: 0 18px; }
    .ticket-info { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    .ticket-info h3 { margin: 0 0 8px 0; }
    .ticket-info p { margin: 4px 0; color: var(--muted); }
    .messages-container {
      border: 1px solid var(--border); border-radius: 14px; padding: 16px;
      min-height: 200px; max-height: 500px; overflow-y: auto; background: var(--bg); margin-bottom: 16px;
    }
    /* ── message layout ──────────────────────────────────────
       Each row is a flex column: owner side controls alignment.
       Customer view: user bubbles are on THEIR right (flex-end),
                      everyone else on the left  (flex-start).
       Staff view:   staff bubbles are on THEIR left  (flex-start),
                      customer bubbles on their right (flex-end).
    ───────────────────────────────────────────────────────── */
    .message        { display: flex; flex-direction: column; margin-bottom: 16px; }
    .message-user   { align-items: flex-end; }
    .message-agent  { align-items: flex-start; }
    .message-content {
      padding: 12px 16px; border-radius: 18px; max-width: 70%; word-wrap: break-word;
    }
    .message-user .message-content  { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
    .message-agent .message-content { background: rgba(0,0,0,0.06); color: var(--text); border-bottom-left-radius: 4px; }
    .message-sender { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .input-area { display: flex; gap: 8px; }
    .input-area textarea {
      flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-family: inherit; resize: none; min-height: 48px;
    }
    .input-area button { padding: 0 24px; height: 48px; }
    .closed-notice {
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
      color: #ef4444; padding: 16px; border-radius: 12px; margin-bottom: 16px;
    }
    .request-human-btn { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-top: 8px; }
    .request-human-btn.requested { background: #6b7280; cursor: default; }
    .staff-reply-indicator { background: rgba(37,99,235,0.1); border: 1px solid rgba(37,99,235,0.3); color: #2563eb; padding: 8px 12px; border-radius: 6px; font-size: 12px; margin-top: 8px; display: none; }
    .joined-banner { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.35); color: #059669; padding: 12px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; animation: joined-in 0.4s ease-out; }
    .joined-banner .joined-icon { font-size: 18px; line-height: 1; }
    .typing-indicator { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: rgba(0,0,0,0.05); border-radius: 10px; font-size: 13px; color: var(--muted); }
    .typing-dots span { display: inline-block; width: 6px; height: 6px; background: var(--muted); border-radius: 50%; margin: 0 2px; animation: typing-bounce 1.4s ease-in-out infinite; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    .fetching-indicator { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: rgba(0,0,0,0.05); border-radius: 10px; font-size: 13px; color: var(--muted); min-height: 48px; }
    .fetching-dots span { display: inline-block; width: 6px; height: 6px; background: var(--muted); border-radius: 50%; margin: 0 2px; animation: typing-bounce 1.4s ease-in-out infinite; }
    .fetching-dots span:nth-child(2) { animation-delay: 0.2s; }
    .fetching-dots span:nth-child(3) { animation-delay: 0.4s; }
    .terms-list { background: rgba(0,0,0,0.03); border-radius: 8px; padding: 16px; margin: 12px 0; border-left: 3px solid #2563eb; }
    .terms-list h4 { margin-top: 0; color: #2563eb; font-size: 15px; }
    .terms-list ul { margin: 8px 0 0 20px; padding: 0; }
    .copyright { text-align: center; padding: 16px; color: var(--muted); font-size: 12px; margin-top: 20px; border-top: 1px solid var(--border); }
    .ticket-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #ef4444; padding: 16px; border-radius: 12px; margin-bottom: 16px; text-align: center; }
    .ticket-error button { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-top: 8px; }
    .ticket-error button:hover { background: #dc2626; }
    @keyframes joined-in    { from { opacity:0; transform:translateY(-6px) } to { opacity:1; transform:translateY(0) } }
    @keyframes typing-bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-4px)} }
  </style>
</head>
<body>
  <nav>
    <a href="../" class="left">Verve Utils</a>
    <div class="links">
      <a href="../">Home</a>
      <a href="../faq/">FAQ</a>
      <a href="../docs/">Docs</a>
      <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </div>
  </nav>

  <div class="chat-container">
    <div id="closed-notice" class="closed-notice" style="display:none;">
      This ticket has been closed. For transcripts and staff reference, tickets cannot be reopened.
      <div style="margin-top:12px;"><a href="../support/" class="new-ticket-btn">Create New Ticket</a></div>
    </div>
    <div id="ticket-error" class="ticket-error" style="display:none;">
      <p id="ticket-error-msg">Unable to load this ticket.</p>
      <button onclick="window.location.reload()">Try Again</button>
    </div>
    <div id="ticket-info" class="ticket-info">
      <h3>Support Ticket</h3>
      <p id="ticket-id">Ticket: Loading&hellip;</p>
      <p id="ticket-status">Status: <span class="status-open">Open</span></p>
    </div>
    <div id="joined-banner" class="joined-banner" style="display:none">
      <span class="joined-icon">&#127891;</span>
      <span id="joined-text"></span>
    </div>
    <div id="typing-banner" class="typing-banner">
      <span id="typing-name"></span>
      <span class="typing-dots"><span>.</span><span>.</span><span>.</span></span>
    </div>
    <div id="transcript-view" style="display:none;padding:20px;background:var(--bg);border-radius:14px;border:1px solid var(--border);margin-bottom:16px;">
      <div id="transcript-content"></div>
      <div style="margin-top:16px;text-align:center;"><a href="../support/" class="new-ticket-btn">Create New Ticket</a></div>
    </div>
    <div id="messages" class="messages-container"></div>
    <div id="staff-reply-indicator" class="staff-reply-indicator"></div>
    <div class="input-area">
      <textarea id="message-input" placeholder="Type your message&hellip;" rows="2"></textarea>
      <button id="send-btn" class="btn btn-black">Send</button>
    </div>
    <button id="request-human-btn" class="request-human-btn">Request Human Support</button>
    <div class="copyright">&copy; 2026 Verve Utils. All rights reserved.</div>
  </div>

  <script>
    const API_BASE   = 'https://backend-five-pink-62.vercel.app/api';
    let   refreshTimeout = null;

    function escapeHtml(text) {
      var d = document.createElement('div'); d.textContent = text; return d.innerHTML;
    }
    function formatTime(ts) { return ts ? new Date(ts).toLocaleTimeString() : ''; }

    // ── fetch helpers ──────────────────────────────────────────────────────────

    /** Return ticket object or null.  Throws on HTTP error. */
    async function getTicket(id) {
      var res  = await fetch(API_BASE + '/tickets/' + encodeURIComponent(id), { headers:{'Content-Type':'application/json'} });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      if (!data || typeof data.id !== 'string') return null;
      return data;
    }

    /** Replace the whole conversation with a new string and return the updated ticket. */
    async function setConversation(id, conv) {
      var res = await fetch(API_BASE + '/tickets/' + encodeURIComponent(id), {
        method: 'PATCH',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ conversation: conv }),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }

    // ── state / config ─────────────────────────────────────────────────────────

    var urlParams    = new URLSearchParams(window.location.search);
    var ticketId     = urlParams.get('ticket');
    var isTranscript = urlParams.get('transcript') === 'true';
    var role         = urlParams.get('role') || 'user';          // "user" | "staff"
    var staffName    = urlParams.get('staffName')
                   || localStorage.getItem('staffName')
                   || 'Staff Member';
    localStorage.setItem('staffName', staffName);

    if (!ticketId) window.location.href = '../support/';

    var lastConvHash     = '';
    var isTyping         = false;
    var typingTimeout    = null;
    var agentHasJoined   = false;
    var lastReplyBy      = '';
    var isLoading        = false;
    var isFetching       = false;
    var fetchingTimeout  = null;
    var aiTypingTimeout  = null;
    var refreshBackoffMs = 0;

    // ── DOM refs ───────────────────────────────────────────────────────────────

    var messagesContainer  = document.getElementById('messages');
    var transcriptView     = document.getElementById('transcript-view');
    var transcriptContent  = document.getElementById('transcript-content');
    var messageInput       = document.getElementById('message-input');
    var sendBtn            = document.getElementById('send-btn');
    var ticketIdEl         = document.getElementById('ticket-id');
    var ticketStatusEl     = document.getElementById('ticket-status');
    var closedNotice       = document.getElementById('closed-notice');
    var ticketErrorEl      = document.getElementById('ticket-error');
    var ticketErrorMsg     = document.getElementById('ticket-error-msg');
    var requestHumanBtn    = document.getElementById('request-human-btn');
    var joinedBanner       = document.getElementById('joined-banner');
    var joinedText         = document.getElementById('joined-text');
    var staffReplyIndicator= document.getElementById('staff-reply-indicator');
    var typingBanner       = document.getElementById('typing-banner');
    var typingName         = document.getElementById('typing-name');

    // ── theme ──────────────────────────────────────────────────────────────────

    var themeToggle = document.getElementById('theme-toggle');
    var themeIcon   = document.getElementById('theme-icon');
    var savedTheme  = localStorage.getItem('theme');
    if (savedTheme === 'dark') { document.body.classList.add('dark'); setIcon('moon'); }
    else                        { setIcon('sun');  }

    themeToggle.addEventListener('click', function () {
      var dark = document.body.classList.toggle('dark');
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      setIcon(dark ? 'moon' : 'sun');
    });

    function setIcon(type) {
      themeIcon.innerHTML = type === 'moon'
        ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>'
        : '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
    }

    // ── AI responses ───────────────────────────────────────────────────────────

    var aiResponses = {
      'hello': 'Hello! How can I help you today?',
      'hi': 'Hi there! What can I assist you with?',
      'help': "I'm here to help! Please let me know what you need assistance with.",
      'bug': "I'm sorry to hear you're experiencing a bug. Could you provide more details about what's happening?",
      'error': "Let's troubleshoot this error. Can you tell me more about when it occurs?",
      'question': "I'd be happy to answer your question. What would you like to know?",
      'issue': 'I understand you have an issue. Let me help you resolve it.',
      'complaint': "I'm sorry for the trouble. Let's get this sorted out for you.",
      'problem': "Let's solve this problem together. What's going on?",
      'thank': "You're welcome! Is there anything else I can help with?",
      'thanks': "You're welcome! Let me know if you need anything else.",
      'stuck': "Let's get you unstuck. Can you share more details about what you're working on?",
      'cant': "Let's figure this out. What specifically are you trying to do?",
      'cannot': "Let's find a solution. What are you trying to accomplish?",
      'slow': 'I apologize for the slow response. Is there something specific I can help with?',
      'lag': "I understand the frustration with lag. Let's see if we can address this."
    };

    // ── rendering ─────────────────────────────────────────────────────────────

    /**
     * Decide which side a bubble goes on.
     *
     * role = 'staff':
     *   - staffName  → left  (message-agent)  — the staff person's OWN messages
     *   - "You"      → right (message-user)   — the customer's messages
     *   - "AI …"     → left                     (not the customer, not current staff)
     *
     * role = 'user':
     *   - "You"/"User" → right — the end user's own messages
     *   - everything else → left
     */
    function ownSide(sender) {
      if (role === 'staff') {
        return sender === staffName || sender === 'You' || sender === 'User'
          ? 'user'       /* customer/self → right */
          : 'agent';    /* everyone else  → left  */
      }
      // default / user
      return sender === 'You' || sender === 'User' ? 'user' : 'agent';
    }

    function addMessage(sender, content, ts) {
      var div = document.createElement('div');
      div.className = 'message message-' + ownSide(sender);
      div.innerHTML =
        '<div class="message-sender">' + escapeHtml(sender) + ' at ' + formatTime(ts || Date.now()) + '</div>' +
        '<div class="message-content">' + content + '</div>';
      messagesContainer.appendChild(div);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function renderMessages(convStr) {
      messagesContainer.innerHTML = '';
      String(convStr || '').split('\n').forEach(function (line) {
        var tsMarker = line.indexOf('[<t>');
        var tsEnd    = tsMarker >= 0 ? line.indexOf('</t>]', tsMarker) : -1;
        var renderTs = Date.now(), rawLine = line;
        if (tsMarker >= 0 && tsEnd > tsMarker) {
          renderTs = parseInt(line.substring(tsMarker + 4, tsEnd), 10) || Date.now();
          rawLine  = line.substring(0, tsMarker) + line.substring(tsEnd + 5);
        }
        var colonIdx = rawLine.indexOf(': ');
        if (colonIdx <= 0) return;
        var sender  = rawLine.substring(0, colonIdx);
        var content = rawLine.substring(colonIdx + 2);
        var div     = document.createElement('div');
        div.className = 'message message-' + ownSide(sender);
        div.innerHTML =
          '<div class="message-sender">' + escapeHtml(sender) + ' at ' + formatTime(renderTs) + '</div>' +
          '<div class="message-content">' + escapeHtml(content) + '</div>';
        messagesContainer.appendChild(div);
      });
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // ── transcript ─────────────────────────────────────────────────────────────

    function showTranscript(ticket) {
      document.getElementById('ticket-info').style.display = 'none';
      messagesContainer.style.display = 'none';
      document.querySelector('.input-area').style.display = 'none';
      requestHumanBtn.style.display  = 'none';
      joinedBanner.style.display     = 'none';
      transcriptView.style.display   = 'block';

      ticketIdEl.textContent = (role === 'staff' ? 'Ticket (staff view): ' : 'Ticket: ') + ticket.id;
      ticketStatusEl.innerHTML = 'Status: <span class="status-open">Open</span>';

      transcriptContent.innerHTML =
        '<div style="margin-bottom:16px;"><h3>Transcript: ' + escapeHtml(ticket.id) + '</h3>' +
        '<p><strong>Subject:</strong> ' + escapeHtml(ticket.subject || 'No subject') + '</p>' +
        '<p><strong>Email:</strong> ' + escapeHtml(ticket.email || '') + '</p>' +
        '<p><strong>Created:</strong> ' + new Date(ticket.timestamp).toLocaleString() + '</p>' +
        (ticket.closedBy ? '<p><strong>Closed by:</strong> ' + escapeHtml(ticket.closedBy) + '</p>' : '') +
        (ticket.closedAt ? '<p><strong>Closed:</strong> ' + new Date(ticket.closedAt).toLocaleString() + '</p>' : '') +
        '</div>' +
        '<div style="background:rgba(0,0,0,0.03);padding:16px;border-radius:8px;line-height:1.6;">' +
        String(ticket.conversation || '').split('\n').filter(function(l){return l.trim();}).map(function(line){
          var tsMarker = line.indexOf('[<t>');
          var tsEnd    = tsMarker >= 0 ? line.indexOf('</t>]', tsMarker) : -1;
          var rawLine  = line;  var renderTs = Date.now();
          if (tsMarker >= 0 && tsEnd > tsMarker) {
            renderTs = parseInt(line.substring(tsMarker + 4, tsEnd), 10) || Date.now();
            rawLine  = line.substring(0, tsMarker) + line.substring(tsEnd + 5);
          }
          var colonIdx  = rawLine.indexOf(': ');
          if (colonIdx <= 0) return '';
          var sender   = rawLine.substring(0, colonIdx);
          var content  = rawLine.substring(colonIdx + 2);
          var sideClass = ownSide(sender);
          return '<div style="margin-bottom:12px;display:flex;flex-direction:column;' +
            (sideClass === 'user' ? 'align-items:flex-end;' : 'align-items:flex-start;') + '">' +
            '<div style="font-size:12px;opacity:0.7;margin-bottom:4px;' +
            (sideClass === 'user' ? 'margin-left:auto;' : '') + '">' + escapeHtml(sender) + '</div>' +
            '<div style="background:' + (sideClass === 'user' ? '#2563eb' : 'rgba(0,0,0,0.05)') +
            ';color:' + (sideClass === 'user' ? '#fff' : 'var(--text)') +
            ';padding:10px 16px;border-radius:18px;max-width:70%;' +
            (sideClass === 'user' ? 'margin-left:auto;' : 'margin-right:auto;') +
            ';word-wrap:break-word;">' + escapeHtml(content) + '</div></div>';
        }).join('') +
        '</div>';
    }

    // ── typing / fetching ──────────────────────────────────────────────────────

    function showTypingIndicator() {
      if (document.getElementById('typing-indicator')) return;
      var div = document.createElement('div');
      div.id = 'typing-indicator'; div.className = 'typing-indicator';
      div.innerHTML = '<span>AI Assistant</span><span class="typing-dots"><span></span><span></span><span></span></span>';
      messagesContainer.appendChild(div);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    function hideTypingIndicator() { var d=document.getElementById('typing-indicator'); if(d) d.remove(); }

    function showFetchingIndicator() {
      if (isFetching) return;
      isFetching = true;
      var div = document.createElement('div');
      div.id = 'fetching-indicator'; div.className = 'fetching-indicator';
      div.innerHTML = '<span>Fetching Correct Docs</span><span class="typing-dots"><span></span><span></span><span></span></span>';
      messagesContainer.appendChild(div); messagesContainer.scrollTop = messagesContainer.scrollHeight;
      if (fetchingTimeout) clearInterval(fetchingTimeout);
      fetchingTimeout = setInterval(function(){
        document.querySelectorAll('#fetching-indicator .fetching-dots span').forEach(function(dot,i){dot.style.opacity=i%3===0?'0.2':'1';});
      }, 300);
    }
    function hideFetchingIndicator() {
      isFetching = false;
      if (fetchingTimeout) { clearInterval(fetchingTimeout); fetchingTimeout = null; }
      var d = document.getElementById('fetching-indicator'); if (d) d.remove();
    }

    async function fetchTermsDocument() {
      try {
        var res  = await fetch('../terms/');
        if (!res.ok) throw new Error('Failed to fetch terms');
        var html = await res.text();
        var text = html.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi,'')
                       .replace(/<style\b[^<]*(?:(?!<\/style>)<[^<]*)*<\/style>/gi,'')
                       .replace(/<\/div>/gi,'\n').replace(/<\/p>/gi,'\n')
                       .replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]*>/g,'')
                       .replace(/\n\s*\n/g,'\n\n').trim();
        hideFetchingIndicator();
        if (text.length > 0) {
          var preview = text.split('\n').map(function(l){return l.trim();}).filter(Boolean).slice(0,8);
          if (preview.length > 5 && text.length > 200) {
            var htmlList = '<div class="terms-list"><h4>Terms Preview:</h4><ul>';
            preview.forEach(function(ln){
              var c = ln.replace(/[\[\]{}()]/g,'').trim();
              if (c.length > 10) htmlList += '<li>' + escapeHtml(c) + '</li>';
            });
            htmlList += '</ul><p><em>&hellip;visit /terms/ for the full document.</em></p></div>';
            await appendLine(htmlList);
          } else {
            await appendLine(text.substring(0,600));
          }
        }
        await appendLine('For the complete Terms of Service, visit /terms/');
      } catch(err) {
        console.error('[terms]', err);
        hideFetchingIndicator();
        await appendLine('AI Assistant: Unable to fetch the Terms of Service right now. Please try /terms/ directly.');
      }
    }

    async function appendLine(content) {
      var t = await getTicket(ticketId);
      if (!t || t.closed) return;
      await setConversation(ticketId, (t.conversation || '') + '\n' + content);
    }

    // ── main ticket loop ───────────────────────────────────────────────────────

    async function loadTicket() {
      if (!ticketId || isLoading) return;
      isLoading = true;
      try {
        var ticket = await getTicket(ticketId);
        if (!ticket || typeof ticket.id !== 'string') {
          hideTypingIndicator(); hideFetchingIndicator();
          if (refreshBackoffMs < 8000) refreshBackoffMs += 1000;
          if (refreshTimeout) clearTimeout(refreshTimeout);
          refreshTimeout = setTimeout(function(){ window.location.reload(); }, refreshBackoffMs);
          return;
        }

        if (ticket.closed) {
          closedNotice.style.display = 'block';
          document.getElementById('ticket-info').style.display = 'none';
          messagesContainer.style.display = 'none';
          document.querySelector('.input-area').style.display = 'none';
          requestHumanBtn.style.display = 'none'; joinedBanner.style.display = 'none';
          transcriptView.style.display = 'none'; ticketErrorEl.style.display = 'none';
          return;
        }

        if (isTranscript) { showTranscript(ticket); return; }

        // ── normal view ─────────────────────────────────────────────────────
        ticketErrorEl.style.display = 'none';
        document.getElementById('ticket-info').style.display = 'block';
        messagesContainer.style.display = 'block';
        document.querySelector('.input-area').style.display = 'flex';
        requestHumanBtn.style.display = role === 'user' ? 'block' : 'none';
        transcriptView.style.display  = 'none';

        if (role === 'staff') {
          ticketIdEl.textContent    = 'Ticket (staff view): ' + ticket.id;
          sendBtn.textContent       = 'Reply as ' + staffName;
          messageInput.placeholder  = 'Type your reply as ' + staffName + '&hellip;';
        } else {
          ticketIdEl.textContent    = 'Ticket: ' + ticket.id;
          sendBtn.textContent       = 'Send';
          messageInput.placeholder  = 'Type your message&hellip;';
        }

        ticketStatusEl.innerHTML = ticket.closed
          ? 'Status: <span style="color:#ef4444;">Closed</span>'
          : 'Status: <span class="status-open">Open</span>';

        if (ticket.claimedBy && ticket.claimedBy !== staffName) {
          joinedText.textContent = ticket.claimedBy + ' has joined your chat';
          joinedBanner.style.display = 'flex';
          if (!agentHasJoined) { agentHasJoined = true; setTimeout(function(){joinedBanner.style.display='none';},6000); }
        } else { joinedBanner.style.display = 'none'; }

        var h = String(ticket.conversation || '').length;
        if (h !== lastConvHash) { lastConvHash = h; renderMessages(ticket.conversation); }

        if (ticket.humanRequested) {
          requestHumanBtn.textContent = 'Human Support Requested';
          requestHumanBtn.classList.add('requested'); requestHumanBtn.disabled = true;
        } else {
          requestHumanBtn.textContent = 'Request Human Support';
          requestHumanBtn.classList.remove('requested'); requestHumanBtn.disabled = false;
        }

        if (ticket.lastReply) {
          staffReplyIndicator.textContent = 'Staff replied: ' + ticket.lastReply;
          staffReplyIndicator.style.display = 'block';
          lastReplyBy = ticket.repliedBy || '';
        } else { staffReplyIndicator.style.display = 'none'; }

        if (ticket.typingBy && ticket.typingBy !== lastReplyBy) {
          lastReplyBy = ticket.typingBy;
          if (ticket.typingBy) {
            typingName.textContent = ticket.typingBy + ' is typing';
            typingBanner.style.display = 'flex';
            if (typingTimeout) clearTimeout(typingTimeout);
            typingTimeout = setTimeout(function(){ typingBanner.style.display = 'none'; }, 3000);
          } else { typingBanner.style.display = 'none'; }
        }

        if (refreshBackoffMs > 0) { refreshBackoffMs = 0; if (refreshTimeout) clearTimeout(refreshTimeout); }

      } catch (err) {
        console.error('[chat] loadTicket:', err.message || err);
        ticketErrorMsg.textContent = err.message || 'Failed to load ticket.';
        ticketErrorEl.style.display = 'block';
        document.getElementById('ticket-info').style.display = 'none';
        messagesContainer.style.display = 'none';
        transcriptView.style.display = 'none'; closedNotice.style.display = 'none';
      } finally { isLoading = false; }
    }

    // ── send / human ───────────────────────────────────────────────────────────

    async function sendMessage() {
      var msg = messageInput.value.trim();
      if (!msg || !ticketId) return;
      sendBtn.disabled = true;
      try {
        var ticket = await getTicket(ticketId);
        if (!ticket || ticket.closed) return;

        var senderLabel = role === 'staff' ? staffName : 'You';
        var newConv = (ticket.conversation || '') + '\n' + senderLabel + ': ' + msg + ' [<t>' + Date.now() + '</t>]';
        await setConversation(ticketId, newConv);

        messageInput.value = '';

        if (role === 'staff') {
          // staff: load immediately; AI does not respond on behalf of staff
          await loadTicket();
        } else {
          // customer: show AI typing indicator if not already escalated
          if (!ticket.humanRequested) {
            showTypingIndicator();
            if (aiTypingTimeout) clearTimeout(aiTypingTimeout);
            aiTypingTimeout = setTimeout(async function () {
              hideTypingIndicator();
              var resp = getAIResponse(msg);
              if (resp) {
                await appendLine('AI Assistant: ' + resp + ' [<t>' + Date.now() + '</t>]');
                await loadTicket();
              }
            }, 1000 + Math.random() * 1000);
          } else {
            await loadTicket();
          }
        }
      } catch (err) {
        console.error('[chat] send:', err.message || err);
      } finally { sendBtn.disabled = false; }
    }

    function getAIResponse(msg) {
      var lower = msg.toLowerCase();
      if (~lower.indexOf('terms') || ~lower.indexOf('tos') || ~lower.indexOf('legal') ||
          ~lower.indexOf('terms of service') || ~lower.indexOf('terms and conditions')) {
        showFetchingIndicator();
        setTimeout(async function(){ if(isFetching){ await fetchTermsDocument(); await loadTicket(); } }, 3000);
        return null;
      }
      for (var k in aiResponses) {
        if (Object.prototype.hasOwnProperty.call(aiResponses, k) && ~lower.indexOf(k)) return aiResponses[k];
      }
      return 'Thank you for your message. A staff member will review this shortly. You can also click "Request Human Support" if you need immediate assistance.';
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', function(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendBtn.click();} });

    requestHumanBtn.addEventListener('click', async function () {
      if (!ticketId) return;
      requestHumanBtn.disabled = true;
      try {
        var t = await getTicket(ticketId);
        var updated = Object.assign({}, t, { humanRequested: true });
        await setConversation(ticketId, (t.conversation||'') +
          '\nAI Assistant: I\'ve notified staff that you need human assistance. Someone will join shortly. [<t>' + Date.now() + '</t>]');
        requestHumanBtn.textContent = 'Human Support Requested';
        requestHumanBtn.classList.add('requested');
        await loadTicket();
      } catch (err) {
        console.error('[chat] requestHuman:', err.message || err);
        requestHumanBtn.disabled = false;
      }
    });

    // ── boot ───────────────────────────────────────────────────────────────────
    loadTicket();
    setInterval(loadTicket, 3000);
  </script>
</body>
</html>
